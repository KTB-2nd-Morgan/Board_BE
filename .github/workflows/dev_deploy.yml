name: Deploy Spring Board

on:
  workflow_dispatch:
    inputs:
      service:  { description: '서비스명', required: true, type: string, default: 'board-backend' }
      env:      { description: '환경(dev|prod)', required: true, type: string, default: 'dev' }
      version:  { description: '버전태그(옵션)', required: false, type: string }

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ inputs.env }}
  cancel-in-progress: false

env:
  AWS_REGION:        ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID:    ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPO:          board/backend
  EC2_INSTANCE_ID:   ${{ secrets.EC2_INSTANCE_ID }}
  N8N_WEBHOOK_URL:   ${{ secrets.N8N_DEPLOY_WEBHOOK }}
  SERVICE:           ${{ inputs.service }}
  ENVIRONMENT:       ${{ inputs.env }}
  VERSION_INPUT:     ${{ inputs.version }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # === Java & Gradle ===
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle (skip tests)
        run: |
          ./gradlew clean build -x test
          JAR=$(ls -1 build/libs/*.jar | head -n1)
          echo "Built JAR: $JAR"
          cp "$JAR" board.jar

      # === 여기서 IMAGE를 계산해 주입 ===
      - name: Compute IMAGE env
        run: |
          echo "IMAGE=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}" >> $GITHUB_ENV
          echo "Computed IMAGE=$IMAGE"

      # === AWS 자격 설정 ===
      # A) 액세스키 방식
      - name: Configure AWS (keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # B) OIDC 역할 가정(권장)
#      - name: Configure AWS (OIDC)
#        if: ${{ env.ROLE_TO_ASSUME != '' }}
#        uses: aws-actions/configure-aws-credentials@v4
#        with:
#          role-to-assume:  ${{ env.ROLE_TO_ASSUME }}
#          aws-region:      ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push image
        id: build
        run: |
          TAG=${{ github.sha }}
          [ -n "${VERSION_INPUT}" ] && TAG="${VERSION_INPUT}"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Rollout on EC2 via SSM
        id: rollout
        run: |
          # 태그 결정 (빈 값이면 latest)
          TAG="${{ steps.build.outputs.tag }}"
          if [ -z "$TAG" ]; then TAG="latest"; fi

          cat > /tmp/ssm_cmds.json <<EOF
          {
          "commands": [
            "set -e",
            "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com",
            "export ECR_IMAGE=${IMAGE}:${TAG}",
            "cd /home/ubuntu/board",
            "docker compose pull",
            "docker compose up -d",
            "for i in 1 2 3 4 5; do sleep 3; if curl -fsS http://localhost/health >/dev/null 2>&1; then echo Health OK; exit 0; fi; echo Waiting for app...; done",
            "echo Health check failed; exit 1"
            ]
          }
          EOF
      
          aws ssm send-command \
          --instance-ids "${EC2_INSTANCE_ID}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy ${SERVICE} to ${ENVIRONMENT}" \
          --parameters file:///tmp/ssm_cmds.json \
          --output text

      - name: Notify Discord (success)
        if: success()
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d @- <<'JSON'
          {
            "embeds": [{
              "title": "✅ Deploy Succeeded",
              "description": "service=${{ env.SERVICE }}\nenv=${{ env.ENVIRONMENT }}\nimage=${{ env.IMAGE }}:${{ steps.build.outputs.tag }}",
              "timestamp": "${{ github.event.repository.updated_at }}"
            }]
          }
          JSON

      - name: Notify Discord (failure)
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d @- <<'JSON'
          {
            "embeds": [{
              "title": "❌ Deploy Failed",
              "description": "service=${{ env.SERVICE }}, env=${{ env.ENVIRONMENT }}\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "timestamp": "${{ github.event.repository.updated_at }}"
            }]
          }
          JSON

